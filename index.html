<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | QR code component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap");
    </style>
    <style>
      :root {
  --main-bg-color:hsl(212, 45%, 89%) ;
  --card-bg-color:hsl(0, 0%, 100%);
  --h2-color:hsl(218, 44%, 22%);
  --p-color:hsl(216, 15%, 48%);
  --attribution-color:hsl(228, 45%, 44%);
}
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: var(--main-bg-color);
        font-family: "Outfit", sans-serif;
      }

      main{
        display: grid;
        place-items: center;
        min-height: 98vh;
      }
      .card {
        background-color: var(--card-bg-color);
        width: 20rem;
        max-width: 100%;
        height: auto;
        display: flex;
        flex-direction: column;
        padding: min(50%,0.625rem);
        gap: 0.625rem;
        border-radius: 10px;
        text-align: center;

        img {
          border-radius: 10px;
          max-width: 100%;
        }

        h1 {
          font-weight: 700;
          color: var(--h2-color);
         padding: min(50%,0.6rem);
         font-size: 1.4rem;
        }

        p {
          font-size: min(100%,0.99rem);
          font-weight: 400;
          color: var(--p-color);
          padding: 0px 22px 0px 22px;
        }
      }

      footer{
                text-align: center;
                word-wrap: normal;

      }

      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: var(--attribution-color);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="card">
        <img src="images/image-qr-code.png" alt="qr-code image" />
        <h1>Improve your front-end skills by building projects</h1>
        <p>
          Scan the QR code to visit Frontend Mentor and take your coding skills to
          the next level
        </p>
      </div>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a href="https://links.codewithmishu.in/">Munish Kumar Sharma</a>.
    </footer>
  </body>
</html>
